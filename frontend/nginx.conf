server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Redirecionar rotas Angular não encontradas para o index.html
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o Backend (opcional, ajustável no docker-compose e caso sua config UI aponte para a mesma origem)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Proxy para os WebSockets (se seu app xadrez usa ws://)
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
