<div class="header w-100 p-3 d-flex align-items-center border-bottom bg-body-secondary">
    <div class="d-flex align-items-center justify-content-between container">
        <div class="d-flex align-items-center">
            <img src="/logo.png" alt="Logo" class="me-2" />
            <h2 class="m-0 fs-3">ChessHub</h2>
        </div>
        @if (showHomeButton()) {
            <a routerLink="home" class="d-flex align-items-center justify-content-center hover-up">
                <img src="/home.png" alt="Home" class="" style="width: 28px; height: 28px;"/>
            </a>
        }
    </div>
</div>
