<div class="modal-overlay" (click)="onClose()">
    <div class="modal-card" (click)="$event.stopPropagation()">

        <div class="modal-header d-flex justify-content-between align-items-center border-bottom p-3">
            <h3 class="m-0 fs-5 fw-bold">{{ title }}</h3>
            <button class="btn-close btn-close-white" (click)="onClose()"></button>
        </div>

        <div class="modal-body mt-4">
            <ng-content></ng-content>
        </div>

        <div class="modal-footer border-top d-flex justify-content-between mt-4 py-3">
            <div class="w-50 px-3">
                <button class="btn btn-secondary w-100" (click)="onClose()">Cancelar</button>
            </div>
            <div class="w-50 px-3">
                <button class="btn btn-primary w-100" (click)="onSubmit()">{{ submitButtonText }}</button>
            </div>
        </div>

    </div>
</div>
