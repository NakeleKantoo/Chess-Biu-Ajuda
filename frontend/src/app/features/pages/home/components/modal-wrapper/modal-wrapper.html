<dialog 
    #dialogElement 
    class="modal-overlay d-flex align-items-center justify-content-center" 
    [class.closing]="isClosing()" 
    (click)="onClose()"
    (cancel)="onCancel($event)"
    aria-labelledby="modal-title"
    role="dialog"
>
    <div class="modal-card" (click)="$event.stopPropagation()">

        <div class="modal-header d-flex justify-content-between align-items-center border-bottom py-3 px-4">
            <h3 class="m-0 fs-5 fw-bold" id="modal-title">{{ title() }}</h3>
            <button class="btn-close btn-close-white" (click)="onClose()" aria-label="Fechar"></button>
        </div>

        <div class="modal-body">
            <ng-content></ng-content>
        </div>

        <div class="modal-footer border-top row gap-5 m-0 py-3 px-4">
            <button class="btn btn-secondary col" (click)="onClose()">Cancelar</button>
            <button class="btn btn-primary col" [disabled]="disabled()" (click)="onSubmit()">{{ submitButtonText() }}</button>
        </div>

    </div>
</dialog>
