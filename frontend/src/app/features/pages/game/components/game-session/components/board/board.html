<div class="board d-flex align-items-center justify-content-center position-relative" [class.flipped]="isFlipped">
    @if (promotionModal) {
        <app-promotion
            [style.left]="'calc(var(--square-size) * ' + (isFlipped ? 7 - promotionColumn : promotionColumn) + ')'"
            [style.top]="currentPlayer === 'white' ? '0' : 'auto'"
            [style.bottom]="currentPlayer === 'black' ? '0' : 'auto'"
            [color]="currentPlayer"
            (promotionSelected)="promote($event)"
            (promotionCancelled)="closePromotionModal()"
        />
    }
@for (row of boardSquares; track $index; let rowIndex = $index) {
    <div class="row" [class.flipped]="isFlipped">
    @for (piece of row; track $index; let colIndex = $index) {
        <app-square
        class="col p-0"
        [position]="getPosition(rowIndex, colIndex)"
        [pointer]="true"
        (squareClicked)="onClick($event)"
        [isFlipped]="isFlipped"
        [isMove]="isMove(rowIndex, colIndex)"
        [isCapture]="isCapture(rowIndex, colIndex)"
        [isLastMove]="isLastMove(rowIndex, colIndex)"
        [isCheck]="isCheck(rowIndex, colIndex)"
    >
        <app-piece [pieceType]="piece" />
    </app-square>
    }
    </div>
}
</div>
