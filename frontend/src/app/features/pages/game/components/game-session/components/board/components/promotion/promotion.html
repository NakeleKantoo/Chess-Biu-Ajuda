<div class="promotion position-absolute d-flex flex-column align-items-center justify-content-start">
    @for (item of promotionPieces; track $index) {
        <app-square [position]="getPosition($index)" [pointer]="true" (squareClicked)="selectPromotion(item)">
            <app-piece [pieceType]="item"></app-piece>
        </app-square>
    }
    <button class="btn w-100 d-flex align-items-center justify-content-center" (click)="cancelSelection()">
        <i class="bi bi-x-lg"></i>
    </button>
</div>
