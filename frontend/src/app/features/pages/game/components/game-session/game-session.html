<div class="game-session vh-100 vw-100 d-flex align-items-center justify-content-center">
    <div class="container__board d-flex align-items-center justify-content-center flex-column">
        <app-timer class="mb-3"
            [isWhite]="isFlipped"
            [playerName]="getPlayerName(isFlipped)"
            [time]="getTimerTime(isFlipped)"
            [isActive]="isTimerActive(isFlipped)"
            [lastMoveTimestamp]="lastMoveTimestamp"
        />

        <app-board [boardDTO]="gameDTO.board" [isFlipped]="isFlipped" (move)="executeMove($event)" />
        
        <app-timer class="mt-3"
            [isWhite]="!isFlipped"
            [playerName]="getPlayerName(!isFlipped)"
            [time]="getTimerTime(!isFlipped)"
            [isActive]="isTimerActive(!isFlipped)"
            [lastMoveTimestamp]="lastMoveTimestamp"
        />
    </div>

    <!-- TODO: adicionar histórico de movimentos, botões para desistência e empate -->
</div>
