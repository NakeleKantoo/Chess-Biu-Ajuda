<div class="game-session min-vh-100 vw-100 d-flex align-items-start justify-content-center overflow-auto p-4">
    <div class="container__game-session d-flex align-items-stretch justify-content-center">
        <div class="container__board d-flex align-items-center justify-content-center flex-column gap-3">
            <app-timer [timerView]="timersView()[0]" />
            <app-board [boardDTO]="gameDTO().board" [isFlipped]="isFlipped()" (move)="executeMove($event)" />
            <app-timer [timerView]="timersView()[1]" />
        </div>
        <div class="container__actions">
            <app-actions [moveHistory]="gameDTO().moveHistory" (action)="executeAction($event)" />
        </div>
    </div>

    @if (gameDTO().endReason && canModalOpen()) {
    <app-game-result-modal [state]="gameDTO().state" [endReason]="gameDTO().endReason!" [isWhite]="!isFlipped()"
        (close)="onModalClose()" (home)="goHome()" />
    }
</div>
