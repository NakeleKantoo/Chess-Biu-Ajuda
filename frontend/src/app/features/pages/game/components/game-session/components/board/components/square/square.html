<div class="square position-relative"
    [class.light]="isLightSquare()"
    [class.dark]="isDarkSquare()"
    [class.pointer]="pointer"
    (click)="onSquareClick()"
>
    <div class="square__label w-100 h-100 position-absolute">
        <p class="row position-absolute top-0 start-0 ps-1"
        >{{ rowLabel }}</p>
        <p class="col position-absolute bottom-0 end-0 pe-1">{{ colLabel }}</p>
    </div>
    <div class="w-100 h-100 position-absolute d-flex align-items-center justify-content-center">
        @if (isCapture) {
        <div class="highlight highlight-capture"></div>
        } @else if (isMove) {
        <div class="highlight highlight-move"></div>
        }
        @if (isLastMove) {
        <div class="highlight highlight-last_move"></div>
        }
    </div>
    <ng-content></ng-content>
</div>
