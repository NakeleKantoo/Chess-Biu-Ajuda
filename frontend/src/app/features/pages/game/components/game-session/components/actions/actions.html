<div class="actions card h-100 d-flex flex-column align-items-center justify-content-between">
    <div class="actions__top w-100">
        <p class="actions__top-title border-bottom w-100 text-center p-3 fs-5 m-0"> Histórico de Lances</p>
        <app-move-history class="actions__history" [moveHistory]="moveHistory()" />
    </div>
    <div class="actions__bottom w-100 p-3 container border-top">
        <div class="row">
            <div class="col px-2">
                <button class="btn btn-primary w-100" (click)="onAction('offer-draw')">Empate</button>
            </div>
            <div class="col px-2">
                <button class="btn btn-secondary w-100" (click)="onAction('resign')">Desistir</button>
            </div>
        </div>
    </div>
</div>
