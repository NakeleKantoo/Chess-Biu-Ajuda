<div class="loading container vw-100 vh-100 d-flex flex-column justify-content-center align-items-center" role="status"
    aria-label="Carregando partida" aria-live="polite">
    <!-- O texto já está visível; o aria-label no container é suficiente -->
    <div class="mini-board" aria-hidden="true">
        @for (tile of miniTabuleiro; track tile) {
        <div class="square" [class.dark]="isDark(tile)"></div>
        }
    </div>

    <div class="loader-container">
        <div class="minimal-spinner" aria-hidden="true"></div>
        <h1 class="h5 mb-0">Carregando partida</h1>
        <p class="opacity-50">Buscando informações no servidor</p>
    </div>
</div>
